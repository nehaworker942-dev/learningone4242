<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', Arial, sans-serif;
}

body{
  background:#FFFDE1;
  color:#111;
  line-height:1.5;
  overflow-x:hidden;
}

/* ========== HERO ========== */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:50px 24px;
}

.hero-box{
  max-width:1140px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:60px;
}

/* LEFT */
.hero-left{
  max-width:520px;
  flex:1 1 50%;
}

.hero-actions{
  margin:0 0 24px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  padding:12px 22px;
  border-radius:12px;
  font-weight:600;
  font-size:15px;
  color:#fff;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(0,0,0,0.12);
}

.call{ background:#0aa89e; }
.whatsapp{ background:#45c556; }

h1{
  font-size:48px;
  font-weight:800;
  color:#111;
  line-height:1.12;
  margin-bottom:16px;
  letter-spacing:-0.5px;
}

.subtitle{
  font-size:17px;
  color:#444;
  margin-bottom:28px;
  max-width:460px;
  line-height:1.6;
}

/* JOIN BUTTON */
.join-wrap{
  background:rgba(255,255,255,0.45);
  padding:10px;
  border-radius:18px;
  display:inline-block;
  margin-bottom:28px;
}

.join-btn{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#f6b400,#c58a00);
  border:none;
  padding:18px 42px;
  font-size:18px;
  font-weight:700;
  color:#fff;
  border-radius:14px;
  cursor:pointer;
  animation:pulse 1.8s infinite;
  letter-spacing:0.3px;
  width:auto;
}

.join-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,.5), transparent);
  transition:.6s;
}

.join-btn:hover::before{
  left:100%;
}

@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(246,180,0,.55); }
  70%{ box-shadow:0 0 0 16px rgba(246,180,0,0); }
  100%{ box-shadow:0 0 0 0 rgba(246,180,0,0); }
}

/* Trust row */
.trust-row{
  display:flex;
  flex-wrap:wrap;
  gap:16px 28px;
  align-items:center;
}

.trust-item{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:500;
  color:#333;
}

.trust-item svg{
  flex-shrink:0;
}

/* RIGHT IMAGE */
.hero-right{
  flex:1 1 45%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.image-wrap{
  max-width:380px;
  width:100%;
}

.hero-image{
  width:100%;
  height:auto;
  border-radius:24px;
  display:block;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,0.12));
}

/* ============================
   TABLET (max-width: 992px)
============================ */
@media (max-width: 992px){
  .hero{
    padding:40px 28px;
  }

  .hero-box{
    gap:40px;
  }

  h1{
    font-size:40px;
  }

  .subtitle{
    font-size:16px;
  }

  .image-wrap{
    max-width:320px;
  }
}

/* ============================
   TABLET / LARGE MOBILE (max-width: 768px)
============================ */
@media (max-width: 768px){
  .hero{
    padding:36px 20px;
    min-height:auto;
  }

  .hero-box{
    flex-direction:column;
    text-align:center;
    gap:32px;
  }

  .hero-right{
    order:-1;
    width:100%;
  }

  .hero-left{
    max-width:100%;
    width:100%;
  }

  h1{
    font-size:34px;
  }

  .subtitle{
    margin-left:auto;
    margin-right:auto;
    font-size:15.5px;
  }

  .hero-actions{
    justify-content:center;
  }

  .join-wrap{
    width:100%;
    max-width:320px;
    margin-left:auto;
    margin-right:auto;
  }

  .join-btn{
    width:100%;
    padding:17px 0;
    font-size:17px;
  }

  .trust-row{
    justify-content:center;
  }

  .image-wrap{
    max-width:280px;
    margin:0 auto;
  }
}

/* ============================
   MOBILE (max-width: 480px)
============================ */
@media (max-width: 480px){

  }

    line-height:1.2;
  }

  .subtitle{
    font-size:14.5px;
    margin-bottom:24px;
  }

  .hero-actions{
    width:100%;
    flex-direction:column;
    gap:10px;
  }

  .btn{
    width:100%;
    justify-content:center;
    padding:14px 20px;
    font-size:15px;
  }

  .join-wrap{
    max-width:100%;
    padding:8px;
  }

  .join-btn{
    padding:16px 0;
    font-size:16px;
  }

  .trust-row{
    gap:12px 20px;
    justify-content:center;
  }

  .trust-item{
    font-size:13px;
  }

  .image-wrap{
    max-width:240px;
  }
}

/* ============================

============================ */
@media (max-width: 360px){

    font-size:26px;
  }

  .subtitle{
    font-size:14px;
  }

  .trust-item{
    font-size:12.5px;
  }
}
</style>
